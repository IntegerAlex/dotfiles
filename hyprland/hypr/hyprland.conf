# Monitor configuration - set scale to 1 to fix zoom
monitor = eDP-2, preferred, auto, 1

exec = hyprpaper &     # Start hyprpaper daemon first (runs in background)
exec = sleep 3         # Wait for it to initialize
exec = hyprctl hyprpaper preload "/home/akshat/Downloads/free-your-soul.png"
exec = hyprctl hyprpaper wallpaper "eDP-2,/home/akshat/Downloads/free-your-soul.png"

exec = waybar &

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show combi -combi-modi drun -modi combi -theme gruvbox-dark

env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,24

windowrulev2 = nofocus, title:^(Android Studio Setup)$
windowrulev2 = stayfocused, class:^(jetbrains-studio)$
windowrulev2 = tile, class:^(jetbrains-studio)$

xwayland {
  force_zero_scaling = true
}   

general {
    gaps_in = 2 
    gaps_out = 10 
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.17
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = windows, 1, 4.8, easeOutQuint
    animation = fade, 1, 2.5, quick
    animation = workspaces, 1, 2.0, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# New gesture syntax (replaces old workspace_swipe options)
gesture = 3, horizontal, workspace

$mainMod = ALT

# ---- Core apps ----
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu

# ---- Window control ----
bind = $mainMod, C, killactive
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, V, togglefloating

# ---- FULLSCREEN / MAXIMIZE ----
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0

# ---- Reload / Exit ----
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod, M, exit

# ---- Layout ----
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# ---- Groups (stacking replacement) ----
bind = $mainMod, S, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

# ---- Focus movement ----
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ---- Workspaces ----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ---- Move windows to workspace ----
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ---- Mouse bindings ----
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

